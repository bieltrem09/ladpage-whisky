<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Raw Boost Light — energético 100% natural</title>
    <meta name="description" content="Raw Boost Light: energy drink em lata de 330 ml com fórmula 100% natural. Abra gelado e siga no seu ritmo." />
    <meta name="theme-color" content="#EAF2FA" />
    <!-- [PLACEHOLDER] descomente com o domínio real:
    <link rel="canonical" href="https://SEU-DOMINIO.com.br/" />
    -->

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Raw Boost" />
    <meta property="og:title" content="Raw Boost Light — energético 100% natural" />
    <meta property="og:description" content="Energy drink de 330 ml com fórmula 100% natural. Abra gelado e siga no seu ritmo." />
    <!-- [PLACEHOLDER] use a URL absoluta quando houver domínio: https://SEU-DOMINIO.com.br/og-image.jpg -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lata Raw Boost Light flutuando acima das nuvens" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raw Boost Light — energético 100% natural" />
    <meta name="twitter:description" content="Energy drink de 330 ml com fórmula 100% natural." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- LCP: primeiro quadro do filme do hero -->
    <link rel="preload" as="image" type="image/webp" href="./frames/hero/001.webp" fetchpriority="high" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Fontes sem bloquear a renderização (display=swap + carga assíncrona) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
      <style>.boot-poster { display: none; }</style>
    </noscript>

    <!-- Primeiro quadro em HTML puro: pinta antes do React (LCP). O hero
         renderizado por cima o cobre; o main.jsx o remove depois. -->
    <style>
      body { margin: 0; background: #eaf2fa; }
      .boot-poster {
        position: absolute; top: 0; left: 0; z-index: 0;
        width: 100%; height: max(380px, 62svh);
        object-fit: cover; object-position: 60% 50%;
      }
      @media (min-width: 761px) and (min-aspect-ratio: 1/1) {
        .boot-poster { height: 100svh; min-height: 640px; max-height: 1100px; }
      }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Raw Boost Light",
        "brand": { "@type": "Brand", "name": "Raw Boost" },
        "description": "Energy drink em lata de 330 ml, linha Light, com fórmula 100% natural conforme o rótulo.",
        "image": "/og-image.jpg",
        "category": "Energy drink"
      }
    </script>
  </head>
  <body>
    <img
      class="boot-poster"
      src="./frames/hero/001.webp"
      alt=""
      aria-hidden="true"
      width="1600"
      height="900"
      fetchpriority="high"
    />
    <div id="root"></div>
    <noscript>
      <img
        src="./hero-poster.webp"
        alt="Lata Raw Boost Light em pé, flutuando acima das nuvens"
        style="display:block;width:100%;height:100svh;object-fit:cover"
      />
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
